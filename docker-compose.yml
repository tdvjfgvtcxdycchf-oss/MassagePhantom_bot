services:
  sshtunnel:
    image: alpine:3.19
    restart: unless-stopped
    command: sh -c "apk add --no-cache --quiet autossh openssh-client && autossh -M 0 -N -D 0.0.0.0:1082 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i /ssh/tunnel_key root@212.118.54.205"
    volumes:
      - /home/zolbrain/transparencybot/ssh:/ssh:ro

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - sshtunnel
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./ssl:/app/ssl:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
